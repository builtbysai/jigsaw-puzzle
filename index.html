<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#33523f">
<meta name="description" content="A focused jigsaw puzzle game. Pick a picture, choose 12 to 192 pieces, and piece it together.">
<link rel="icon" href="data:,">
<title>Jigsaw Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header class="head">
    <h1>Jigsaw Puzzle</h1>
    <span id="picName">Mountain Lake</span>
  </header>

  <div class="bar">
    <div class="group">
      <button class="btn primary" id="newBtn" type="button">New game</button>
      <button class="btn" id="undoBtn" type="button" disabled>Undo</button>
      <button class="btn" id="ghostBtn" type="button" aria-pressed="true">Guide</button>
      <button class="btn" id="peekBtn" type="button">Hold to peek</button>
      <button class="btn" id="hintBtn" type="button">Hint</button>
    </div>
    <div class="group">
      <span class="seg-label" id="sizeLabel">Pieces</span>
      <div class="seg" role="group" aria-labelledby="sizeLabel" id="sizeSeg">
        <button type="button" data-n="12">12</button>
        <button type="button" data-n="24">24</button>
        <button type="button" data-n="48">48</button>
        <button type="button" data-n="96">96</button>
        <button type="button" data-n="192">192</button>
      </div>
    </div>
    <div class="stats">
      <span class="stat">Placed <b id="statPlaced">0 / 0</b></span>
      <span class="stat">Time <b id="statTime">0:00</b></span>
      <span class="stat">Moves <b id="statMoves">0</b></span>
    </div>
  </div>

  <div class="layout">
    <main class="stage" id="stage">
      <canvas id="table" aria-label="Puzzle table. Drag pieces onto the board; drag empty felt to move the view; scroll or pinch to zoom."></canvas>

      <div class="zoom" role="group" aria-label="View controls">
        <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button type="button" id="fitAll" aria-label="Show whole table" title="Show whole table"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button type="button" id="fitBoard" aria-label="Zoom to board" title="Zoom to board"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h16M12 4v16"/></svg></button>
      </div>

      <div class="busy" id="busy" role="status"></div>
      <div class="winbar" id="winBar" role="status">
        <span id="winText">Solved</span>
        <button class="btn primary" id="againBtn" type="button">Play again</button>
      </div>
      <p class="help">Drag pieces onto the board. Drag empty felt to move around; scroll or pinch to zoom.</p>
    </main>

    <aside class="shelf" aria-label="Pictures">
      <div class="shelf-head">
        <h2>Pictures</h2>
        <input id="picSearch" type="search" placeholder="Search pictures" aria-label="Search pictures" autocomplete="off">
      </div>
      <div class="grid" id="picker" role="group" aria-label="Choose a picture"></div>
    </aside>
  </div>

</div>

<input type="file" id="fileInput" accept="image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/pictures.js"></script>
<script src="js/scene.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
